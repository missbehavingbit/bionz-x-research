[workspace]
resolver = "2"
members = [
    "crates/bionz-core",
    "crates/bionz-preset",
    "crates/bionz-fit",
    "crates/bionz-gpu",
    "crates/bionz-raw",
    "crates/bionz-compare",
    "crates/bionz-target",
    "crates/bionz-cli",
    "crates/bionz-app",
    "crates/bionz-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"
