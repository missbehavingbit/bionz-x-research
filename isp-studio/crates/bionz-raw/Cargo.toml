[package]
name = "bionz-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Image and CFA front end for stages 1-5"

[features]
default = ["gpu"]
gpu = ["dep:bionz-gpu"]

[dependencies]
anyhow.workspace = true
bionz-core = { path = "../bionz-core" }
image.workspace = true
rawler = "0.8"
sha2 = "0.10"
thiserror.workspace = true
bionz-gpu = { path = "../bionz-gpu", optional = true }
