name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails & Layout (stdlib)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"

      - name: Run local/CI parity guardrails
        run: python -m tools.research.ci_check --summary

  emulator-suite:
    name: Emulator Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run full offline test suite
        run: python -m unittest discover -s tests -q

  native-probes:
    name: Native Probes (ARMv7 & Host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ARMv7 cross-compiler and Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-dev-armel-cross
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run host-check probe harness
        run: python probes/build_probe.py --host-check

      - name: Cross-compile uvc_dma_probe for ARMv7
        run: |
          mkdir -p probes/build/ci-arm
          arm-linux-gnueabi-gcc \
            -std=gnu11 -march=armv7-a -mfloat-abi=softfp -O2 \
            -Wall -Wextra -Werror \
            -ffreestanding -nostdlib -static -fno-stack-protector -fno-pic -fno-pie \
            -Wl,-e,_start \
            probes/uvc_dma_probe.c -o probes/build/ci-arm/uvc_dma_probe

      - name: Run probe report tests
        run: python -m unittest tests.test_probes_report -q

      - name: Build and test Mod Loader v2 & MenuTouchFull (ARMv7 + Unicorn)
        run: |
          CI_SKIP_SYSROOT=1 bash tools/native_camera/mlv2/build_wsl.sh /tmp/ci-mlv2
          python tools/native_camera/mlv2/test_mlv2_unicorn.py /tmp/ci-mlv2
          CI_SKIP_SYSROOT=1 MLV2_TARGET=a6100 bash tools/native_camera/mlv2/build_wsl.sh /tmp/ci-mlv2-a6100
          bash mods/menu_touch_full/build_mtf_v2_wsl.sh /tmp/ci-mtf
          python mods/menu_touch_full/test_mtf_v2_unicorn.py /tmp/ci-mtf

      - name: Build and verify Film Simulation SMOD v2 mods (a6100 & a6400 ARMv7)
        run: |
          bash mods/film_sims/live_picker/build_live_wsl.sh a6400 /tmp/ci-live-a6400
          bash mods/film_sims/live_picker/build_live_wsl.sh a6100 /tmp/ci-live-a6100
          bash mods/film_sims/film_texture/build_wsl.sh /tmp/ci-film-tex/film_texture /tmp/ci-film-tex/luma_grain
          python -c '
          import struct
          from pathlib import Path
          for mod_dir in ("/tmp/ci-live-a6400", "/tmp/ci-live-a6100"):
              raw = (Path(mod_dir) / "FilmSimLive.mod").read_bytes()
              magic, ver, flags, name, code_size, fnv, bss, on_off, off_off, hooks = struct.unpack_from("<III32s6I", raw)
              assert (magic, ver, flags, hooks) == (0x444F4D53, 2, 20, 1), (mod_dir, magic, ver, flags, hooks)
              target, size, fixup = struct.unpack_from("<IBB", raw, 68)
              assert (target, size) == (0x0655A528, 12), (mod_dir, hex(target), size)
          for p, label in (("/tmp/ci-film-tex/film_texture/FilmTexture.mod", b"Film Texture"),
                           ("/tmp/ci-film-tex/luma_grain/LumaGrain.mod", b"Luma Grain")):
              raw = Path(p).read_bytes()
              magic, ver, flags, name, code_size, fnv, bss, on_off, off_off, hooks = struct.unpack_from("<III32s6I", raw)
              assert (magic, ver, flags, name.rstrip(b"\0"), hooks) == (0x444F4D53, 2, 0, label, 0)
          '
          python -m unittest tests.test_a6100_film_sim_studio tests.test_a6100_film_texture tests.test_a6100_classic_chrome -q

  pr-summary:
    name: CI Summary
    needs: [guardrails, emulator-suite, native-probes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary and enforce job results
        run: |
          {
            echo "## CI Pipeline Results"
            echo ""
            echo "| Job | Result |"
            echo "| :--- | :---: |"
            echo "| \`guardrails\` | \`${{ needs.guardrails.result }}\` |"
            echo "| \`emulator-suite\` | \`${{ needs.emulator-suite.result }}\` |"
            echo "| \`native-probes\` | \`${{ needs.native-probes.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.guardrails.result }}" != "success" || \
                "${{ needs.emulator-suite.result }}" != "success" || \
                "${{ needs.native-probes.result }}" != "success" ]]; then
            echo "One or more required CI jobs failed or were cancelled." >&2
            exit 1
          fi
