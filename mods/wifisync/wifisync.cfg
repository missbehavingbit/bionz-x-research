# WiFiSync camera-side configuration.
# Copy this file to  E:\mods\wifisync.cfg  (the camera reads A:/mods/wifisync.cfg
# read-only through Sony's Fsys API; nothing is written to the card).
#
# Keys are parsed by the mod (ssid/psk/channel/width/idle_sec/standby/folder/
# first_index/min_jpg/min_arw/camera_id) and by /tmp_bt/wifisync/ap.sh
# (nvram/country/allow_2g). Unknown keys are ignored.

ssid=A6400-5G-SYNC
# WPA2-PSK passphrase: 8..63 ASCII characters. Change it before first use.
psk=change-this-passphrase

# Non-DFS 5 GHz channel: 36, 40, 44 or 48. Width: 80, 40 or 20 MHz.
# The submenu in the Mods tab overrides these two at the next ON.
channel=36
width=80

# ACTIVE -> STANDBY after this many seconds with an empty queue.
idle_sec=45
# low = keep the AP associated and use `wl pm 2`; deep = AP down + WL_REG_ON low
# (the phone then needs the Phase 2.5 BLE wake, which is not implemented yet).
standby=low

# DCF folder under A:/DCIM that receives the photos.
folder=100MSDCF

# NVRAM profile used by bcmdhd (relative to /usr/share/network/nvram).
nvram=high/bcm4339_H_14.txt

# Regulatory country string for `wl country` (empty = leave stock).
country=

# 1 = continue on 2.4 GHz when `wl bands` does not expose 5 GHz.
allow_2g=0

# Completeness floor in bytes, used to ignore half-written files.
min_jpg=1024
min_arw=100000
