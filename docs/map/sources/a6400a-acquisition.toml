[[claim]]
id = "C01"
entities = ["body.ilce6400a"]
status = "verified-physical"
text = "ILCE-6400A 1.01 was qualified as a reference target with its kernel, partition, MMIO and emulator-hook map; the native read-only transport hit an unresolved model-info BUSY before MSC reply lifetime fixes verified the native identity."
