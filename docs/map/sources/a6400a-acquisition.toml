[[claim]]
id = "C02"
entities = ["proc.jiritsu-senser"]
status = "verified-offline"
text = "Jiritsu routing and Senser encoding reproduce offline packet fixtures; explicit DMM fixtures cover 24-byte metadata, share/open counters and bounded borrowed replies to a memory-only sink, with USB disabled."
evidence = ["E0525:a6400a", "E0532:a6400a"]

[[claim]]
id = "C03"
entities = ["proc.jiritsu-senser"]
status = "verified-offline"
text = "ILCE-6400A nflasha5 is a WBI1 image that names Jiritsu, and 1.01 libJiritsu dispatches GET_FILE on halfword 8."
evidence = ["E0552", "E0554"]

[[claim]]
id = "C04"
entities = ["soc.miscreg-efuse", "proc.partition-capture"]
status = "verified-physical"
text = "Neither DGU5 nor the ILCE-6400 / ILCE-6400A kernels verify kernel signatures; live MISCREG/eFuse values were read with a bounded single-page /dev/mem probe; a single-slot <= 512 KiB chunk planner was added."
evidence = ["E0643"]

[[claim]]
id = "C05"
entities = ["proc.jiritsu-senser", "body.ilce6400a"]
status = "verified-physical"
text = "Bounded debugger ioctl fixtures pass, but feature 0x23 returns 05/20/00 with no data; repeated live Senser authentication works and the bounded file request returns 0xFF01 / status 0x80 with zero payload."
evidence = ["E0667", "E0668"]

[[claim]]
id = "C06"
entities = ["proc.jiritsu-senser"]
status = "verified-offline"
text = "Offline Senser dispatch reproduces the missing-handler 0x80 decision; Ghidra finds a level-3 fallback to a fixed read-only /dev/nflasha5 callback; fixed-reader framing and completion controls and a guarded acquisition client were built without weakening FF01 guards."
evidence = ["E0669", "E0670", "E0671", "E0672"]

[[claim]]
id = "C07"
entities = ["proc.partition-capture"]
status = "verified-physical"
text = "The first real ILCE-6400A nflasha5 partition was captured (62,914,560 bytes, SHA-256 d131b73f...) with independent host readback agreement; STOP remained unacknowledged."
evidence = ["E0673"]

[[claim]]
id = "C08"
entities = ["proc.partition-capture"]
status = "verified-physical"
text = "2,097,152 genuine MSC LUN 1 bytes were saved through unchanged USBSTOR (SHA-256 824fb214...); the matching-size nflasha23 backing is unattested. An expanded review obtained no further bytes."
evidence = ["E0674", "E0675"]

[[claim]]
id = "C09"
entities = ["proc.partition-capture"]
status = "verified-physical"
text = "A native reader captured and SHA-256 verified all 17 allowed nonzero nflasha partitions (1,354,694,656 bytes) without lowering the 8-MiB memory guard; nflasha5 matches E0673 bit for bit. nflasha23 and the whole device stay unacquired, and mounted partitions are live snapshots."
evidence = ["E0643"]

[[frontier]]
id = "F01"
title = "Remaining ILCE-6400A flash boundary"
state = "open"
entities = ["proc.partition-capture"]
evidence = ["E0643", "E0675"]
next = "Excluded nflasha23 and the whole-device image remain; mounted partitions are non-atomic snapshots. Any further capture needs an explicit scope decision, not a weakened guard."

[[hazard]]
id = "H01"
title = "Lowering the reader memory guard"
effect = "Free memory below the 8-MiB floor risks the live camera during transfers."
rule = "Keep the 8,192-KiB guard; reclaim page cache read-only (POSIX_FADV_DONTNEED) instead of lowering it."
evidence = ["E0643"]

[[hazard]]
id = "H02"
title = "Service-mode side effects"
effect = "Native feature 7 can delete/back up configuration before a getter; Ghidra shows internal-flash effects before the Jiritsu library load."
rule = "No speculative loader, driver change or mode entry; review body-specific entry and cleanup contracts first."
evidence = ["E0669", "E0675"]
