[meta]
area = "usb-composite"
title = "USB composite UVC/PTP on the physical camera (before EP0 runs)"
scope = """
Live-view sources, UVC/PTP gadget infrastructure, the shared UVC+PTP module, native hooks and CPU barriers, composite enumeration, teardown, PTP live view and the Track B roadmap up to Run A."""
evidence_span = "see record index"
reviewed = "2026-11-22"
records = [
  "E0132-E0137",
  "E0139-E0218",
  "E0239-E0258",
  "E0260-E0296",
  "E0315-E0317",
  "E0319-E0322",
  "E0339-E0353",
  "E0407:b1",
]

[[entity]]
id = "usb.liveview-source"
kind = "process"
name = "Live-view JPEG source and DMM/ScalarInfra path"
