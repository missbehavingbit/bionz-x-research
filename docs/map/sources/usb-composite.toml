[[hazard]]
id = "H01"
title = "USB mode switch while a UVC overlay is active"
effect = "Switching to PC Remote during an active UVC overlay rebooted the camera."
rule = "Stop and retire the session before any USB mode change."
evidence = ["E0340"]

[[hazard]]
id = "H02"
title = "Teardown without unconfigure-first"
effect = "Device stayed 'unknown' in MSC after Track B sessions; battery pull needed and /tmp_bt receipts lost."
rule = "Use the unconfigure-first soft-disconnect (E0352/E0353) and copy receipts off before recovery."
evidence = ["E0248", "E0255", "E0350", "E0352"]

[[hazard]]
id = "H03"
title = "Hooking live im.elf code"
effect = "A hook without stop scope and four-core cache sync risks crashing PID 149."
rule = "Install hooks only inside a verified CPU barrier with four-core cache synchronization and restore the original instruction on retirement."
evidence = ["E0192", "E0203", "E0205"]
