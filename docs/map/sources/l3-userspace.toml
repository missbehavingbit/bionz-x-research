[[claim]]
id = "C09"
entities = ["process.im-elf", "dev.uipc-osal"]
status = "verified-offline"
text = "With a modelled positive UIPC receive timeout the app leaves a 19M-instruction poll loop for a real wait and, at 308.6M instructions, is service-idle waiting for producers."
evidence = ["E0308", "E0309"]

[[claim]]
id = "C10"
entities = ["dev.gles-sugilite"]
status = "verified-offline"
text = "GLES completion is keyed by task TGID (task+0x108); the 128 KiB dmpgles2 mapping is uninitialized software-shared memory, not the 16 KiB GPU BAR; caller bit 24 selects recovery, not event presence."
evidence = ["E0530:gles"]

[[claim]]
id = "C11"
entities = ["lib.libobj", "process.im-elf"]
status = "verified-offline"
text = "Every former heap assertion was caused by Unicorn 2.1.4 carrying stale Thumb-2 ITSTATE across IT-block branches; with the fix, unmodified im.elf runs 1.50B instructions and 120 threads with 0 heap ownership errors and no 0x4C->0x50 padding."
evidence = ["E0657"]

[[claim]]
id = "C12"
entities = ["dev.gles-sugilite", "problem.l3-display"]
status = "verified-offline"
text = "Unmodified im.elf decompresses 62 /dev/ldec UI atlases, completes 24 Sugilite GPU jobs with 24 IRQ 76 completions and presents double-buffered 640x480 RGBA4444 viewRootPowerSw.uxc frames on OSD A and B; the frames are transparent."
evidence = ["E0657"]

[[claim]]
id = "C13"
entities = ["dev.dmm-grm", "problem.l3-display"]
status = "verified-offline"
text = "Appframework CreateFramebuffer(640,480) is a GRM-MA open for DMM unit 0x4092e; captured unit 0x4092e is OSD A/B and an opt-in mapping opens the authentic 640x480 surface. The post-CreateFramebuffer wait is a fixed 20 ms sleep-poll, not a render loop."
evidence = ["E9001", "E9002", "E9004", "E9006"]

[[claim]]
id = "C14"
entities = ["dev.gles-sugilite"]
status = "verified-offline"
text = "The display is OSD A/B 640x480 RGBA4444 and the GPU is a DMP SMAPH-S30; the gl_common/Sugilite buffer is an internal buffer, not the screen."
evidence = ["E0298", "E0314"]

[[claim]]
id = "C15"
entities = ["lib.libobj"]
status = "verified-offline"
text = "The isolated original log-block constructor writes only through offset 0x48 and fits libc's 0x4C usable extent; the opt-in 0x50 request padding is a trial, not an allocator correction."
evidence = ["E0526:stella"]

[[claim]]
id = "R01"
entities = ["lib.libobj"]
status = "retracted"
text = "The Appframework malloc assertion is a confirmed stella pool-boundary bug, not an emulator bug."
