kind = "device"
name = "/dev/uipc and the OSAL UIPC runtime"
inventory = ["kernel.modules:osal_uipc", "firmware.elf:nflasha15_unpacked/lib/libosal_uipc.so"]
summary = "Kernel UIPC character device plus libosal_uipc user-space queues, semaphores and callbacks used by every Sony process."

[[entity]]
id = "dev.dmm-grm"
