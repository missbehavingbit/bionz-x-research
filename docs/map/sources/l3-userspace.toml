id = "C01"
entities = ["tool.interpreter-probe", "lib.loader-libc"]
status = "verified-offline"
text = "The original interpreter executes to its first syscall; guarded brk, image-backed kernel identity and a read-only guest filesystem carry it into original library search and header reads."
