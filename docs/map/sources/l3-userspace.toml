name = "DMM / GRM memory managers"
aliases = ["unit 0x280", "unit 0x4092e", "GRM-MA"]
inventory = ["kernel.modules:dmm", "kernel.modules:grm_ma"]
summary = "Sony's DMM configuration/allocation service and the GRM memory allocator. Units name physical pools such as OSD A/B."

[[entity]]
id = "dev.timer"
kind = "device"
name = "Sony timer service (utimer / freerun)"
inventory = ["kernel.modules:utimer"]
summary = "Freerun timer, rollover and calendar services that the application programs through DMM-backed state."

[[entity]]
id = "dev.gles-sugilite"
kind = "device"
name = "grm_gles / Sugilite GPU path"
aliases = ["dmpgles2", "SMAPH-S30", "IRQ 76"]
inventory = ["kernel.modules:grm_gles", "firmware.elf:nflasha15_unpacked/kmod/grm_gles.ko"]
summary = "DMP SMAPH-S30 GPU driver (grm_gles.ko, /dev/dmpgles2). 128 KiB software-shared memory plus a 16 KiB MMIO window; jobs complete through IRQ 76."

[[entity]]
id = "problem.l3-display"
kind = "problem"
name = "L3 display stays transparent"
summary = "The first OSD A/B frames presented by unmodified im.elf are transparent because DefRootView waits for external av-cam / sub-micro producers."

