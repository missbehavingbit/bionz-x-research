[[entity]]
id = "process.im-elf"
kind = "process"
name = "im.elf (Sony main application process)"
aliases = ["PID 149", "im.elf debug s g r u l i a lazy-global"]
inventory = ["firmware.elf:nflasha15_unpacked/bin/im.elf"]
summary = "Sony's main application process. On the camera it runs as PID 149 with argv 'im.elf debug s g r u l i a lazy-global' and about 181 threads. Executed unmodified under InterpreterProbe."

[[entity]]
id = "tool.interpreter-probe"
kind = "tool"
name = "InterpreterProbe (L3 user-space executor)"
summary = "Bounded Unicorn user-space executor with explicit, opt-in guest contracts (syscalls, devices, mounts). Stops with PC, arguments and reason at anything unsupported."

[[entity]]
id = "lib.loader-libc"
kind = "module"
name = "ld-2.11.2.so and libc-2.11.2.so"
inventory = ["firmware.elf:nflasha7_unpacked/lib/ld-2.11.2.so", "firmware.elf:nflasha7_unpacked/lib/libc-2.11.2.so"]
summary = "Original dynamic linker and glibc 2.11.2. Their brk, mmap2, kuser-helper, TLS, NPTL and sysconf paths were the first L3 contracts."

[[entity]]
id = "lib.libobj"
kind = "module"
name = "libObj.so (application object library)"
inventory = ["firmware.elf:nflasha15_unpacked/lib/libObj.so"]
summary = "20,860,436-byte application library holding the stella allocator, Appframework, GLES client and most application logic."

[[entity]]
