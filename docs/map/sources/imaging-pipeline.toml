[[hazard]]
id = "H01"
title = "Color matrix RAM patches persist"
effect = "The a6400 color matrix table at 0x6444a044 is saved to /setting/Backup.* on power-off, so RAM patches become persistent."
rule = "Restore original matrix values before power-off unless a persistent change is intended and authorized."
evidence = ["E0555"]
