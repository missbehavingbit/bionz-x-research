[[claim]]
id = "C01"
entities = ["qemu.board"]
status = "verified-offline"
text = "QEMU boots the main nflasha3 firmware once the Sony entry contract is used (Image at 0x00108000, initrd at 0x00700000, a 'kemco'+cmdline block at 0x00103000, r1=0xDA9) and a backup.ko file_load error that cascaded into about 20 module failures is fixed. Four Cortex-A5 cores start through the pen_release handshake with SRAM mailboxes at 0xFE005010..18 (the CXD90014 pattern from Oein/a5000-emulator). The native eMMC needs 4 MiB boot0 + 4 MiB boot1 before the SDM user area and sector addressing below 2 GiB; two independent input preparations give identical hashes."
evidence = ["E0521", "E0522:qemu", "E0524:reproducible"]

[[claim]]
id = "C02"
entities = ["qemu.board"]
status = "verified-offline"
text = "Five threads sleeping in vpool_alloc were a full UIPC realtime queue 0x13A (1,078 pending, no consumer): osal_ulogio.ko failed to load because /setting/ulogio.bin was missing. Supplying it unblocks Appframework."
evidence = ["E0525:qemu"]

[[claim]]
id = "C03"
entities = ["qemu.submicro"]
status = "verified-offline"
text = "SIO, GPIO and ADC models carry the sub-micro link on SIO channel 3; real a6400 sub-micro frames captured from one read-only 4 KiB /dev/mem page were replayed."
evidence = ["E0526:qemu", "E0527:real"]

[[claim]]
id = "C04"
entities = ["qemu.avcam-sequencer"]
status = "verified-offline"
text = "The ObjMic start stall was an unanswered av-cam ADF request; the ADF decode showed the missing SYSV frame clock, and with VPH timing ObjMic proceeds; the SYSV phase bit had been hidden by the clock stub."
evidence = ["E0528", "E0529", "E0535"]

[[claim]]
id = "C05"
entities = ["qemu.display"]
status = "verified-offline"
text = "After SetContentTarget the UI render loop keeps running; Sugilite P3D/PPF draws the shooting-screen OSD while the YUV layer stays off because av-cam never writes GO to the SA DSP and the imager never starts an SA function or sensor transfer."
evidence = ["E0530:qemu", "E0531", "E0532:qemu", "E0533:qemu", "E0534:qemu"]

[[claim]]
id = "C06"
entities = ["qemu.display"]
status = "verified-offline"
text = "Console 0 is the viewfinder readout; the eye sensor is not the a5000 hinge pin; the view asks two finder predicates; monitor layouts sit beside EVF layouts; forcing isOutputEvf false does not switch the panel skin."
evidence = ["E0536", "E0537", "E0538", "E0539", "E0540", "E0541", "E0542"]

[[claim]]
id = "C07"
entities = ["qemu.avcam-sequencer"]
status = "verified-offline"
text = "CamCore start is gated so PowerOn never runs; the mode sequencer waits at step 12 on module 1, whose 0x0105 latch is never published; source 30 arriving before source 29 kept VD_Sequence from running."
evidence = ["E0543", "E0544", "E0549", "E0550", "E0551", "E0553", "E0557"]

[[claim]]
id = "C08"
entities = ["qemu.avcam-sequencer"]
status = "verified-offline"
text = "Module 3 holds step 32 waiting for PQD Ydet statistics (accepts 0x32E only after a per-frame counter passes 6). The Ydet adapter caller (0x63D3DD36), window configuration (0xF3015848..54) and the pending EE callback were traced; CamPig enable readback, dispatch order/input sync and Sgc1 event A are opt-in models. The 0xF3000000 handler runs on IRQ 36 after E0569 corrected the IRQ-table record alignment."
evidence = ["E0561", "E0563", "E0564", "E0565", "E0566", "E0567", "E0568", "E0569"]

[[claim]]
id = "C09"
entities = ["qemu.display"]
status = "verified-offline"
text = "A rear-monitor selector, firmware rear-LCD rendering, an interactive rear panel and blank-vs-disconnected detection were added; stock FINDER/MONITOR selection works without a diagnostic overlay."
evidence = ["E0571", "E0572", "E0573", "E0574", "E0651"]

[[claim]]
id = "C10"
entities = ["qemu.display", "qemu.avcam-sequencer"]
status = "verified-offline"
text = "Opt-in LIVEVIEW_SOURCE produced the first firmware-driven 640x480 live-view frame on the rear LCD (583,680 active bytes); a synthetic chart does not qualify the sensor or recording."
evidence = ["E0591"]

[[claim]]
id = "C11"
entities = ["qemu.board"]
status = "verified-offline"
text = "Merged contributor PRs #35-#42 (alexscemo) report boot scores that this workspace did not re-run: read-back register files at 0xF2800000, 0xF3500000 and 0xF3880000 and the CamCore model at 0xF3010000 keep the same final sequencer state and [VPH] prefix while unmodelled pairs fall (3,065 -> 2,855 -> 2,416 for the first two); TB_JMP_CACHE_BITS 14 cuts time to the final state by about 14%; the v11 SD patch checks insertion per block instead of per byte."
evidence = ["E0614", "E0615", "E0616", "E0617", "E0618", "E0637"]

[[claim]]
id = "C12"
entities = ["qemu.handover"]
status = "verified-offline"
text = "Custom OS prerequisites: an opt-in CXD4115 watchdog at 0xF2402000, cache/MMU teardown checks before a kexec-style jump, DMA quiescence contracts, the original work-DMA start/stop/busy contract at 0xF0102000 and an opt-in copy model."
evidence = ["E0636", "E0638", "E0639", "E0640", "E0641"]

[[claim]]
id = "C13"
entities = ["qemu.handover"]
status = "verified-offline"
text = "The LIRO ram section copied by the work DMA is av-cam's own initialised RW data (1,878 references from av-cam code), not a sub-core image."
evidence = ["E0644"]

[[claim]]
id = "C14"
entities = ["qemu.board"]
status = "verified-offline"
text = "Virtual SD hotplug works with the original file service, and an offline USB Mass Storage baseline exists; settings survive a fresh process after an explicit native save."
evidence = ["E0650"]

