[[hazard]]
id = "H02"
title = "Git Bash rewrites camera paths in host commands"
effect = "A host-side read of /tmp_bt/... failed because Git Bash converted the path, and the chained rm removed the helper, forcing a second /dev/mem page read."
rule = "Run camera-path commands from PowerShell or with path conversion disabled, and never chain cleanup after an unverified read."
evidence = ["E0527:real"]

[[frontier]]
id = "F01"
title = "Stock playback, still capture and remaining controls in QEMU"
state = "open"
entities = ["qemu.board", "qemu.display"]
evidence = ["E0591", "E0650", "E0651", "E0652"]
next = "Verify remaining application controls, automatic shutdown save, stock JPEG playback and still capture. A synthetic chart does not qualify the sensor or recording."

[[hazard]]
id = "H01"
title = "QEMU backs the reserved first MiB with RAM"
effect = "A /dev/mem read that warm-rebooted the camera passes silently in the default board."
rule = "Use lowmem-abort=on to reproduce the camera's AXI DECERR for PA 0x000F8000-0x000F8FFF before trusting a low-memory probe."
evidence = ["E0647"]
