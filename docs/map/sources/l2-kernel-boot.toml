[[claim]]
id = "C01"
entities = ["boot.contract"]
status = "verified-offline"
text = "nflasha1 holds a complete updater boot set (ARM zImage, cramfs initrd, kemco.txt with console=ttyAM0,115200n8, loadaddr.txt 0x00108000/0x00700000/0x00103000, p1chksum MD5s of the two images); nflasha3 holds the main set. The app requests an update by writing /setting/updater/mode* markers and running ud_send_lsi.elf / ud_reboot.elf; the updater consumes mode1/2/3/5/6. The loader-to-Linux boot mode is backup record 0x51000F (UPDATER 3, ADJUST 5, USB_CHARGE 6, BIS 0x0C), read by upm.ko and bootin.elf."
evidence = ["E0413"]

[[claim]]
id = "C02"
entities = ["boot.contract", "soc.irq-timer-uart"]
status = "verified-offline"
text = "Sony's setup_arch accepts a boot-parameter override at 0x60103000 only if it starts with 'kemco' (strncmp 5); it then parses from ptr+5, turns CR/LF into spaces and stops at '*'. Standard ATAGS or raw cmdline text there are rejected ('invalid cmdline override') and the built-in kemco CONFIG_CMDLINE (init=/sbin/init) is used. With the kemco form, init=/bin/ash is parsed and attempted."
evidence = ["E0424", "E0425"]

[[claim]]
id = "C03"
entities = ["mmu.exceptions"]
status = "verified-offline"
text = "Guest data aborts, __ex_table fixups, prefetch aborts, SP banking, CP15 IFSR/IFAR hooks and SVC-mode abort stubs were implemented step by step until real USER-mode execution ran."
evidence = ["E0419", "E0420", "E0429", "E0430", "E0431", "E0433", "E0435"]

[[claim]]
id = "C04"
entities = ["mmu.exceptions"]
status = "verified-offline"
text = "Two different translation problems blocked ld.so: the repeated 0x04031AF0 fault was a stale DFAR/DFSR on the user data-abort path (fixed, page installed), and the following 0x0402F666 loop persisted with a valid PTE because the guest's TLBIALL/TTBR0 maintenance does not flush Unicorn's SoftMMU. UC_TLB_VIRTUAL with a UC_HOOK_TLB_FILL page-table walker, a live-TTBR1 kernel walk and activation deferred to the first real user return resolve translation."
evidence = ["E0441", "E0443", "E0445", "E0446:pabt", "E0448", "E0449", "E0452", "E0457"]

[[claim]]
id = "C05"
entities = ["user.thumb-return"]
status = "verified-offline"
text = "The PC=0 resume was a restore-path issue in ret_to_user; SPSR-tail capture gave the first true Thumb USR entry at 0x0402E790; generation-tagged pt_regs eliminated stale replays and ld-2.11.2.so executes deep into relocation."
evidence = ["E0459", "E0461", "E0463", "E0491", "E0492"]

[[claim]]
id = "C06"
entities = ["user.thumb-return"]
status = "verified-offline"
text = "Fixing the true user register bank, the ret_fast_syscall restore and the enforced USR|Thumb return let the first loader SVCs (brk) and the second syscall execute."
evidence = ["E0494", "E0498", "E0500", "E0503", "E0504"]

[[claim]]
id = "C07"
entities = ["tool.unicorn-machine", "boot.contract"]
status = "verified-offline"
text = "The offline nflasha1 updater kernel boots to an interactive BusyBox v1.13.4 /bin/ash on ttyAM0 and runs uname -a and ls -la / (800M instructions, 11,420 serial bytes, no unmapped access). It needed amba2.console=1 with PL011 IRQ 150 delivery, kuser-page hooks and COW decode at 0xFFFF0FCC, a SoftMMU flush on switch_mm, and per-frame SP_usr restore so a sys_clone child keeps its own stack. This run still used the manual-restore machinery later removed by E0533."
evidence = ["E0510"]

[[claim]]
id = "C08"
entities = ["user.thumb-return", "mmu.exceptions"]
status = "verified-offline"
text = "The real cause of the 'ARM decoding' symptom was host diagnostics: entry code hooks walked user page tables through a nested emu_start of an ARM MRC helper, interrupting the Thumb entry (whose first two instructions are 4-byte Thumb-2 loads, so 4-byte PC steps prove nothing). With hook-safe CP-register access and no nested emu_start, two fresh nflasha1 replays run ld.so, enter BusyBox at 0x0000C438 (USR/Thumb) and complete ash builtin roundtrips with 0 manual Thumb recoveries and identical UART bytes."
evidence = ["E0533:native"]

[[claim]]
id = "C09"
entities = ["tool.unicorn-machine"]
status = "verified-offline"
text = "Unicorn and the patched QEMU sony-a6400 board match in the ret_to_user window except CPSR.A (QEMU sets it on kernel entry and IRQ entry) and F; non-secure A/F handling reproduces the exception return. Unicorn runs as Cortex-A9 (MIDR 0x410FC090) and QEMU as Cortex-A5 (0x410FC051), so adjacent proc_info slots are chosen; the first user Thumb entry address differs between runs (historical 0x0402E790, later 0x0400C790 / 0x040C2790); the Thumb loader prefix matches while the VFP capability word differs."
evidence = ["E0545", "E0547", "E0548", "E0558", "E0559", "E0560", "E0562"]

[[claim]]
id = "C10"
entities = ["tool.unicorn-machine"]
status = "verified-offline"
text = "The updater child/COW continuation works after making the handle_mm_fault return hook passive; with --vfp-d16-mvfr0 the kernel advertises AT_HWCAP 0x0000E0D7, matching QEMU."
evidence = ["E0653"]

[[claim]]
id = "C11"
entities = ["boot.nflasha3", "tool.unicorn-machine"]
status = "verified-offline"
text = "Captured nflasha3 main firmware boots under UnicornMachine through stock /sbin/init, 9 mounts, 39 .ko modules, LIRO entry_main, im.elf DMP_2D_Initialize : 0 and /bin/ash past 2.8B instructions under --mmio stop."
