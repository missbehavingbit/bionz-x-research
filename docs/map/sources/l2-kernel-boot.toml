[[claim]]
id = "C13"
entities = ["tool.unicorn-machine"]
status = "verified-offline"
text = "No ld.so.preload, ld.so.conf, init.d or rcS ships in the live or packaged initrd or in /usr; preload paths are debug modes gated by /setting/mode/dmode and /setting/mode/preload. im.elf's environment has no LD_PRELOAD or LD_LIBRARY_PATH. Runtime /etc is a writable vfat mount of /dev/nflasha10, where /etc/ld.so.preload lists only the two project-installed diagnostics. The init mount table and order were recovered."
evidence = ["E0418:b-userspace"]

