[[claim]]
id = "C47"
entities = ["user.thumb-return", "mmu.exceptions"]
status = "verified-offline"
text = "0x0402F666 is the Thumb-2 literal load ldr.w r4,[pc,#0xbec] (data at 0x04030254); the fault decoder lacked PC-relative bases, so it was misclassified as a prefetch abort. Also: the fast-syscall frame capture clobbered the syscall return r0 (brk(0) ran twice); ld.so switches to ARM-mode helpers and __sigsetjmp's vstmia needs FPEXC.EN; kernel uaccess helpers such as __strncpy_from_user must demand-page user VAs. With these, ld.so issues uname, mmap2, access, open and stat64."
