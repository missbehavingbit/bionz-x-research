status = "verified-offline"
text = "Opt-in --qemu-peripherals add the QEMU SYSV/VPH/evsel frame clock (SYSV 0xF3402000 IRQ 98 every 33,367 us, VPH 60 Hz vsync IRQ 101/102, evsel ext-vd IRQ 83/84) and QEMU-oracle SIO channel-3 start/done (IRQ 204), GPIO port-1 input 0x32 and ADC done with released-key results 0x3FF. These models are unit-tested; no captured nflasha3 replay was run with them, and the E0656 input set is not in this workspace."
