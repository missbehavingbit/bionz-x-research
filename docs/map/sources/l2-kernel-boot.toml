[[claim]]
id = "C28"
entities = ["boot.contract", "boot.nflasha3"]
status = "verified-offline"
text = "The live nflasha3 kernel, initrd and av-cam.bin differ from the update package (live Sony CE Linux 8.2.6.0, 2021; package 8.2.5.7, 2017); the other ten files are identical. The live dump is the authoritative input. Kernel layout: PA 0x00108000, PAGE_OFFSET 0x60000000, _stext 0x60108160, _etext 0x6048D024, linux_banner 0x603C8028, 24,600 symbols."
evidence = ["E0415"]

[[claim]]
id = "C29"
entities = ["boot.contract", "soc.irq-timer-uart"]
status = "verified-offline"
text = "Machine ID 0x0DA9 (ARM-CXD900X0) was recovered from both kernels' machine_desc. With a reconstructed 884-byte ATAG list at 0x00103000 (core, two memory banks, cmdline) and r0=0, r1=0x0DA9, r2=0x00103000, the updater kernel runs head.S, enables the MMU and reaches calibrate_delay, which waits for a timer interrupt. GIC distributor 0xF8001000, CPU interface 0xF8000100 and timer 0xF2403000 were recovered from the init code."
evidence = ["E0416"]

[[claim]]
id = "C30"
entities = ["soc.irq-timer-uart"]
status = "verified-offline"
text = "The CXD timer uses IRQ 153 (setup_irq 0x99) with gic_init(0, 29, 0xF8001000, 0xF8000100); timer base 0xF2403000: control +0x00, divider +0x04 (write 1 acknowledges), period +0x08 (0x2710 = 100 Hz on 1 MHz), free-running counter +0x10C. A GIC model with GICD_TYPER = 1024 lines delivered 368 timer IRQs, so calibrate_delay completes from real jiffies and the kernel reaches PCI, initrd probe and hwtimer init."
evidence = ["E0417"]

[[claim]]
id = "C31"
entities = ["mmu.exceptions"]
status = "verified-offline"
text = "Unicorn 2.1.4 executes LDREX/STREX correctly on mapped memory; the stop after the timer model was a guest data abort at VA 0 (ldrex r2,[r5], r5=0 in cmpxchg_futex_value_locked+0x50), which Unicorn surfaced as UC_ERR_EXCEPTION. An opt-in exclusive-to-plain patch (1,990 LDREX, 1,990 STREX, 3,324 barriers) does not remove that stop; abort delivery is the real gap."
evidence = ["E0418:cxd90045"]

[[claim]]
id = "R04"
entities = ["mmu.exceptions"]
status = "refuted"
text = "Unicorn 2.1.4's ARM target cannot execute ARMv7 exclusive instructions (LDREX/STREX)."
evidence = ["E0417"]
superseded_by = "C31"

[[hazard]]
id = "H01"
title = "Booting the updater set on hardware"
effect = "The updater init starts UdtrMain.sh, the update engine, immediately; the original CautionConfig incident came from an in-place truncation of /usr."
rule = "Treat updater boot as a firmware operation: emulate it, never trigger it on a camera without explicit scope; any recovery copy must use cp, sync, size/SHA verification and never truncate in place."
evidence = ["E0413"]

[[claim]]
id = "C32"
entities = ["boot.contract", "user.thumb-return"]
status = "open"
text = "Contradiction to resolve: E0413 lists /sbin/init (a shell script) among the updater cramfs entries, while the E0422/E0425 cramfs decodes of nflasha1 boot/initrd.img find no /sbin/init or /bin/sh, and the default boot panics with 'Failed to execute /sbin/init ... No init found'. Later boots use init=/bin/ash."
evidence = ["E0413", "E0422", "E0425"]

[[claim]]
id = "C33"
entities = ["mmu.exceptions"]
status = "verified-offline"
text = "futex_init deliberately probes cmpxchg_futex_value_locked(NULL); its __ex_table entry (insn 0x6015BDCC -> fixup 0x60364BD4) was found among 46,277 parsed pairs. Delivering kernel faults with a table entry directly to the fixup (5 fixups) lets boot pass futex_init to console registration, brd/loop/smsc911x, VFP init and the cramfs ramdisk load. The Sony 'VFP is not D16 type' BUG at 0x6041FFD8 is skipped by a labelled bne->b patch at PA 0x41FFD8."
evidence = ["E0419", "E0420"]

[[claim]]
id = "C34"
entities = ["tool.unicorn-machine", "boot.contract"]
status = "verified-offline"
text = "The kernel's klog buffer (klog.addr=0x034A0000, 128 KiB) holds the real boot log. It shows console [klog0] as the only console (so nothing went to the PL011), a CRCDC timeout at 0xF2A31000, dwc3 probe -110, the cramfs root mounted read-only and then 'Failed to execute /sbin/init ... Kernel panic - not syncing: No init found' followed by Sony's exception monitor. UART0..2 resources are 0xF2000000/0xF2001000/0xF2002000."
evidence = ["E0421", "E0422"]

[[claim]]
id = "R05"
entities = ["user.thumb-return"]
status = "retracted"
text = "The updater kernel reached first userspace: /sbin/init ran /bin/sh as PID 1, which then took a NULL-vector user exception."
evidence = ["E0421"]
superseded_by = "C34"
note = "E0422: the PID-1 dump belongs to the init task panicking with 'No init found'; no user-mode instruction ran."

[[claim]]
id = "C35"
entities = ["soc.irq-timer-uart"]
status = "verified-offline"
text = "Two models unlocked the serial console: the CRCDC clock block (write 1 to 0xF2A31000+0x30, poll bit 0 clear) removes the timeout, and the PL011 PrimeCell ID registers (PeriphID 0x00141011, PCellID 0xB105F00D at +0xFE0..0xFFC) let amba_device_register succeed. Then 'uart0: ttyAM0 at MMIO 0xf2000000 (irq = 150)' and console [ttyAM0] enabled; 52,976 bytes were captured and injected RX bytes drive Sony's exception monitor, whose shell is compiled out (EM_DEBUG)."
evidence = ["E0423", "E0424"]

[[claim]]
id = "R06"
entities = ["soc.irq-timer-uart"]
status = "retracted"
text = "The kernel's PL011 console uses a different physical base or an unobserved alias, which is why no UART writes appear at 0xF2000000."
evidence = ["E0420", "E0421"]
superseded_by = "C35"

[[claim]]
id = "C36"
entities = ["user.thumb-return"]
status = "verified-offline"
text = "In the updater cramfs /bin/ash is a 7-byte symlink to busybox; busybox (233,448 B) is a dynamic ARM EABI5 ELF with Thumb entry 0xC439 and PT_INTERP //lib/ld-linux.so.3, which resolves to a valid ld-2.11.2.so. kernel_execve returned -EFAULT for every existing binary and -ENOENT for the missing defaults, and no user-mode instruction ran."
evidence = ["E0425", "E0426", "E0427"]

[[claim]]
id = "C37"
entities = ["mmu.exceptions", "user.thumb-return"]
status = "verified-offline"
text = "The -EFAULT came from two emulator bugs: the __ex_table fixup was applied before delivering the data abort, which skipped demand paging for the exec BSS (padzero / __clear_user_std at VA 0x48ac6), and DFSR was written with the fault address instead of the FSR. With both fixed, exec reaches user mode (CPSR USR) at 0x0402e790, an unmapped ld.so text page."
evidence = ["E0428"]

[[claim]]
id = "C38"
entities = ["mmu.exceptions", "user.thumb-return"]
status = "verified-offline"
text = "Prefetch-abort delivery (IFAR/IFSR via CP15, vector 0xFFFF000C), routing every USR-mode fault to the kernel, and an emulated vector stub that writes the {r0, pc, spsr} frame to a scratch page before entering __pabt_usr/__dabt_usr isolate SP_abt from SP_svc. The 0x0402e790 prefetch abort is delivered, but resuming it still ended in the exception monitor at this point."
evidence = ["E0429", "E0430"]

[[claim]]
id = "C39"
entities = ["mmu.exceptions", "user.thumb-return"]
status = "verified-offline"
text = "Unicorn banks SP per mode (SP_svc and SP_usr survive mode switches). The real blocker was the kernel's CP15 reads: v7_early_pabort / v7_early_abort read IFAR/IFSR/DFSR/DFAR as 0. Hooking those MRC sites (0x60119B60/64 and 0x60119B44/48) to inject the delivered fault registers made user code run: user-mode entries from 0x0402E790 (USR + Thumb) inside ld-2.11.2.so, with 106 demand-paging prefetch aborts."
evidence = ["E0431", "E0432", "E0433"]

[[claim]]
id = "R07"
entities = ["mmu.exceptions"]
status = "refuted"
text = "Unicorn shares R13/R14 across modes, so user SP/LR must be emulated by hand on every exception."
evidence = ["E0429", "E0430", "E0431"]
superseded_by = "C39"

[[claim]]
id = "C40"
entities = ["mmu.exceptions", "tool.unicorn-machine"]
status = "verified-offline"
text = "Kernel VAs (0x60000000+) were written through Unicorn's physical mem_read/mem_write without translation, corrupting pt_regs; translating them fixed ARM_sp. The secondary crash at do_page_fault+0x34 was a NULL thread_info->task on a stale captured SVC stack (0x7DC0C000 instead of 0x7DC0E000); using the live banked SP_svc and refreshing it at ret_to_user gives a valid task (0x7E36DBE0). A same-fault guard (8 repeats) cut diagnostic runs to about 16 s."
evidence = ["E0437", "E0439", "E0440", "E0441"]

[[claim]]
id = "R08"
entities = ["mmu.exceptions"]
status = "refuted"
text = "Kernel-mode data aborts through the hardware ABT vector build bad pt_regs, which causes the bad-pgd oops at 0x04031af0."
evidence = ["E0434"]
superseded_by = "C40"
note = "E0435 implemented the SVC vector-stub path and the oops was unchanged."

[[claim]]
id = "C41"
entities = ["user.thumb-return", "mmu.exceptions"]
status = "verified-offline"
text = "0x04031AF0 is the Thumb load ldr r3,[r1,r0] (live bytes match ld.so offset 0x3AF0) with effective address 0x0404DF48 in ld.so's second PT_LOAD. Unicorn reports this guest translation fault as a bare UC_ERR_EXCEPTION with no unmapped-access hook, so the machine now walks TTBR0 -> L1 -> L2, decodes the instruction with capstone and delivers a data abort for the computed address (read/write by mnemonic). Unicorn also couples CPSR.T to the PC's low bit, so PC writes must keep the Thumb LSB."
evidence = ["E0436", "E0442", "E0443", "E0444", "E0445"]

