[[claim]]
id = "C42"
entities = ["mmu.exceptions"]
status = "verified-offline"
text = "With a valid, executable PTE for 0x0402F000 the fetch at 0x0402F666 still repeated after 19 TTBR0-rewrite + TLBIALL + DSB + ISB flushes, so this Unicorn build does not honour guest TLB maintenance; toggling SCTLR to force a QEMU flush broke boot early. Unicorn 2.1.4's UC_TLB_VIRTUAL + UC_HOOK_TLB_FILL, with a hook that only reads physical memory and walks the live tables, removed the loop (1,195 fills, 0 misses)."
evidence = ["E0446:pabt", "E0447", "E0448"]

[[claim]]
id = "C43"
entities = ["mmu.exceptions", "tool.unicorn-machine"]
status = "verified-offline"
text = "TTBR1 reads live as 0x00104000 (swapper_pg_dir) and the vmalloc/fixmap walk was fixed. Running the whole boot under the virtual TLB then hit __rt_mutex_init(NULL) from a separate init_section_page_cgroup invocation (647 normal iterations carry valid heap pointers), so the virtual TLB is now switched on only at the first user return; the early boot stays on UC_TLB_CPU."
evidence = ["E0449", "E0450", "E0451", "E0452"]

[[claim]]
id = "C44"
entities = ["mmu.exceptions", "user.thumb-return"]
status = "verified-offline"
text = "At deferred activation both TTBR0 and TTBR1 read 0x00104000. cpu_v7_switch_mm (0x6011A26C) is missing from the machine's decoded kallsyms and was never executed, and none of the four ARM TTBR0-write sites ran (no Thumb-2 form exists). Gating activation on a real user return (stacked user PC below 0x60000000 and a valid current->mm->pgd) captures activation pgd 0x1F144000 and user TTBR0 0x1DC1C000; ld.so is entered, and the next blocker was a resume at PC 0."
evidence = ["E0453:user", "E0454", "E0455", "E0456:thumb", "E0457"]

[[claim]]
id = "C45"
