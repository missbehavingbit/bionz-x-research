[[claim]]
id = "C26"
entities = ["boot.contract"]
status = "verified-physical"
text = "In normal boot nflashaB0, nflashaB1, nflasha1 and nflasha3 are readable with O_RDONLY (not locked after boot); read-only dumps were streamed through the debugger and re-hashed on the host. nflashaB0 starts with EXBL and carries loader code; nflashaB1 is all zero (zeroed vs zero-backed is unknown); nflasha1 matches the E0306 dump byte for byte."
evidence = ["E0414"]

[[claim]]
id = "C27"
entities = ["boot.contract"]
status = "verified-offline"
text = "nflashaB0 is the first-stage loader: one 0x200-byte EXBL container (seven 0x40-byte records, six used, load = 0xFE040000 + start*512, entry 0xFE047000 reset vector) holding a Sony DGU5 loader V85.00.03 with LPDDR3 init, FAT access, the 0x0051000F boot-mode literal, a backslash \\updater\\mode path and Backup.bin load strings. In Unicorn it programs UART0, clocks and the timer but never touches the 0x00103000 parameter block in the traced prefix."
evidence = ["E0415", "E0416"]

