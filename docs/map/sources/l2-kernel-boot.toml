[[claim]]
id = "C25"
entities = ["boot.contract"]
status = "verified-offline"
text = "The updater cramfs /sbin/init loads its modules, mounts /setting, starts UdtrMain.sh and then loops a password-less /bin/ash --login on the console unless /root/IAMLDUDWRT exists (it does not in the preserved image). viewUnified2.so has DT_NEEDED CautionConfig.so, so a truncated CautionConfig.so stops the unified UI at link time."
