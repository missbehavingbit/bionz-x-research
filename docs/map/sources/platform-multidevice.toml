area = "platform-multidevice"
title = "CXD90045 multi-device platform"
scope = """
Thirteen official updaters, nine kernels, command tables, IPC and call graphs, update-chain integrity, firmware signatures, additional bodies (ILCE-7RM4A) and the project checkpoint inventory."""
