#
# This file is the hand-curated source of truth. `docs/map/usb-ep0.md` and
# `docs/map/index.json` are generated from it by
#     python -m tools.research.knowledge_map build
# and `python -m tools.research.knowledge_map check` fails when they drift or
# when any evidence reference, entity link, or supersession link is invalid.
#
# Every claim cites evidence records. The map summarises; the evidence records
# remain authoritative. When a claim changes, do not edit it in place: add the
# new claim, then set `superseded_by` on the old one and `status` to
# "retracted" or "refuted" so the history stays visible.
#
# Evidence references are E-IDs ("E0468"). Where two records share a number,
