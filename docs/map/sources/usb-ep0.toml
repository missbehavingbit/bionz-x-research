name = "DWC3 EP0 control state machine (stock kernel)"
aliases = ["ep0state", "ep0_next_event", "dwc3_ep0_interrupt"]
summary = """
Stock Synopsys DWC3 gadget backport in the a6400 kernel. ep0state 1=setup,
2=data, 3=status; ep0_next_event at dwc+0x2dc. The status TRB is armed only
from the XferNotReady(STATUS) handler (or the delayed_status queue path)."""
related = ["fn.do-control-status", "fn.dwc3-ep0-interrupt", "field.dwc-2d8", "fn.giveback"]

[[entity]]
id = "fn.do-control-status"
inventory = ["kernel.text:__dwc3_ep0_do_control_status", "kernel.dwc3:__dwc3_ep0_do_control_status"]
kind = "function"
name = "__dwc3_ep0_do_control_status"
address = "0x602b253c"
summary = """
ABI r0 = struct dwc3 *dwc, r1 = struct dwc3_ep *dep. Only two callers:
0x602b34b0 (NRDY STATUS, after writing ep0state=3 at 0x602b3454) and
0x602b27f0 (delayed_status queue path, needs dwc+0x2d8 bit5)."""
related = ["dwc3.ep0", "fn.start-trans"]

[[entity]]
id = "fn.start-trans"
inventory = ["kernel.text:dwc3_ep0_start_trans", "kernel.dwc3:dwc3_ep0_start_trans"]
kind = "function"
name = "dwc3_ep0_start_trans"
address = "0x602b2424"
summary = """
Writes the TRB first, then issues DEPCMD STARTTRANSFER via
send_gadget_ep_cmd 0x602b0220 (polls 500x, -110 on timeout). On success sets
dep BUSY (flags |= 0x10), resource index, next=1. A BUSY dep makes a second
arm a silent no-op."""
related = ["fn.do-control-status", "dwc3.ep0"]

