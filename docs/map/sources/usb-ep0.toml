[[hazard]]
id = "H01"
title = "Arming the status stage without writing ep0state=3"
effect = "Next XferComplete(status) is dispatched to complete_data with an empty request list: NULL read at 0x602b30d8 in IRQ context, a reboot risk."
rule = "Any status arm must write dwc->ep0state=3 before calling 0x602b253c (mirror 0x602b3454). E0476 does this; the E0366 'status kick' did not."
evidence = ["E0366", "E0476"]

[[hazard]]
id = "H02"
title = "Wrong completion-callback ABI in a thunk"
effect = "Camera kernel crash and reboot during the session (Run B8)."
rule = "req->complete is complete(ep, req) and runs with dwc->lock released."
evidence = ["E0363", "E0364"]

[[hazard]]
id = "H03"
title = "schedule_work on a zero-initialised static work_struct"
effect = "Kernel BUG in __queue_work from the DISCONNECT branch; camera warm-rebooted in teardown (Run B23)."
rule = "Self-initialise every work_struct (INIT_WORK equivalent) and guard scheduling; fixed in E0456."
evidence = ["E0453:runb23", "E0456:runb23"]

[[hazard]]
id = "H04"
title = "Legacy Mass Storage restore in a shared-PTP build"
effect = "Restore clears gc+0x6c, re-arms EP0 and raises D+; host GET_DESCRIPTOR -> make_device_desc+0x70 ldrh through NULL -> oops -> warm reboot (Run B24)."
