id = "C27"
entities = ["module.usbg-video"]
status = "verified-physical"
text = "Run B: the live START endpoint selector accepted the 0x84 bulk-IN wrapper (flags&1 set, ownership wrapper+0x24 == raw, descriptor 7,5,0x84,bulk,512); the *(dep+0x4C)&1 precondition did not reject it, so endpoint selection is not the RenderStream failure."
