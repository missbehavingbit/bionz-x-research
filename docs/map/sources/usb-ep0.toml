First class request after enumeration, GET_CUR(VS_PROBE_CONTROL) 26 B on
interface 2, takes 5.000-5.012 s on the host; SET_CUR is then canceled after
another ~5 s; later retries fail fast with XACT_ERROR; ffmpeg reports
'Could not RenderStream to connect pins'. Reproduced in B14, B18, B19, B20,
B21, B24, B25."""
