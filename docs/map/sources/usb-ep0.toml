[meta]
area = "usb-ep0"
title = "USB / DWC3 EP0 control path (Track B UVC/PTP)"
scope = """
Why the authored UVC+PTP composite (054C:0322) on the ILCE-6400 cannot stream:
the UVC VS_PROBE GET_CUR control transfer stalls ~5 s, SET_CUR is canceled,
and EP0 then wedges. Covers the DWC3 EP0 state machine in the stock kernel,
our bridge module, the physical runs B2..B25, and the open fix E0476."""
body = "ILCE-6400, kernel 3.0.27_nl-rt106 (retained live-vmlinux.bin, file_off = VA - 0x60108000)"
evidence_span = "E0354-E0476"
reviewed = "2026-11-22"
records = ["E0354-E0399", "E0446:ep0", "E0453:runb23", "E0456:runb23", "E0458", "E0465", "E0468", "E0471", "E0476"]
# Read in full and checked claim by claim (see docs/map/CURATION_PLAN.md).
deep_reviewed = ["E0354-E0399", "E0446:ep0", "E0453:runb23", "E0456:runb23", "E0458", "E0465", "E0468", "E0471", "E0476"]
not_covered = """
Earlier composite/PC Remote work (E0132-E0343), the native USB debugger
(E0090, E0400-E0403), QEMU USB modelling (E0579-E0598, E0655) and the
L3 OTG SET_MODE stop (E0534). Those need their own map areas."""

