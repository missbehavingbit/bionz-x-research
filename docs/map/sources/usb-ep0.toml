evidence = ["E0458", "E0465", "E0468"]

[[hazard]]
id = "H05"
title = "Switching to Mass Storage with the module still loaded"
effect = "The MSC switch hangs and a battery pull is needed, which also wipes /tmp_bt receipts (B16, B18-B21)."
rule = "STOP does not release the UVC configuration; unload the module (restore descriptors) before the MSC switch, or rely on a verified deferred disconnect restore. The debugger is unreachable in PC Remote, so plan the teardown order before the session."
