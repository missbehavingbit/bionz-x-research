[[claim]]
id = "C16"
entities = ["problem.get-cur-5s"]
status = "verified-offline"
text = "Tooling for the 5 s hypothesis: a fail-closed CLASS abort guard (holds before unbind/free/reconnect when a CLASS request may still be outstanding; Unicorn teardown suite 13/13), camera-side CLASS/VENDOR setup and START/STOP logging, and a crash-safe --dmesg-sd kernel trace to A6400K.LOG. Unicorn shows core_cb_class returns 0 synchronously for probe/commit with no deferred queue inside it."
evidence = ["E0355", "E0356"]

[[claim]]
id = "C17"
entities = ["dwc3.ep0"]
status = "verified-offline"
text = "The EP0 queue target is the UDC, not gadgetcore: ep0->ops is dwc3_gadget_ep0_ops and its queue slot is dwc3_gadget_ep0_queue 0x602b2ad0 -> __dwc3_gadget_ep0_queue 0x602b26ec. It validates only structural EP0 state (-108 / -16) and returns 0 on three paths that arm no transfer, so a class result of 0 does not prove the reply was submitted. core_cb_class never reads its r0 argument and always uses the singleton this_ex reply buffer."
evidence = ["E0358"]

[[claim]]
id = "R08"
entities = ["problem.get-cur-5s"]
status = "retracted"
text = "Run B3: GET_CUR(PROBE) was answered with 0 and never delivered to the host."
evidence = ["E0357"]
superseded_by = "C01"
note = "E0357's erratum (E0358) corrects the gadgetcore framing and the 181-TID park claim; Run B9 (E0365) and the B18 RAM ring (E0392) show the GET_CUR data stage completes in about 1 ms."

[[claim]]
id = "C18"
entities = ["module.usbg-video", "dwc3.ep0"]
status = "verified-physical"
text = "Runs B4-B7: translated GET_CUR still timed out with clean teardown; both EP0 transfers armed (next=1, BUSY) but SET had dma=0 because both request-prep paths leave dma=0 and the UDC maps only IN; an OUT DMA wrapper fixed the mapping yet both transfers still timed out."
evidence = ["E0359", "E0360", "E0361", "E0362"]

[[claim]]
id = "C19"
entities = ["fn.dwc3-ep0-interrupt"]
status = "verified-physical"
text = "Exact TRB captures: the completion handler reads the same unvalidated TRB slot (no HWO check); GET's TRB was consumed (HWO 1->0, size 26->0) while SET's bounce TRB was never consumed (HWO stays 1, size 0x40). The B10 probe saw the raw TRB pointer in DMA space."
evidence = ["E0367", "E0368", "E0369"]

[[claim]]
id = "C20"
entities = ["dwc3.ep0"]
status = "verified-offline"
text = "Corrected lpos timeline for Run B12 (lpos is the currently executing event): GET's NRDY(STATUS) at 0x29c arrived after the data completion set next=3, so ep0state became 3 and the status TRB was armed in that same batch; an ep0 XferComplete at 0x2a0 later retired it, ahead of SET_CUR's SETUP at 0x2a4. B12 does not show when 0x2a0 happened; B25 (E0471) shows the retirement only after the host's Stop Endpoint. SET's completion is a separate puzzle (C42)."
evidence = ["E0373", "E0375", "E0384", "E0471"]

[[claim]]
id = "R09"
entities = ["dwc3.ep0"]
status = "retracted"
text = "Run B12: a stale pending XferComplete(ep0) caused SET's HWO=1 giveback, and setup_req returning 0 double-queues a delegated zero-length request."
evidence = ["E0371", "E0372"]
superseded_by = "C20"
note = "E0373 corrects the E0371/E0372 lpos reading."

[[claim]]
id = "C21"
entities = ["fn.setup-req"]
status = "verified-physical"
text = "Run B13: gadgetcore's ep0 is the same object as the class ep0 (68a1c9c0, eq=1). setup_req's delegated queue at 0x9fd8 (caller LR 602b9fdc) is real but was observed only for standard enumeration requests (lengths 18, 39, 26, 4, 20, 9, 0), never during GET_CUR/SET_CUR. The camera rebooted after that run's otherwise clean teardown."
evidence = ["E0374", "E0375"]

[[claim]]
id = "C22"
entities = ["fn.setup-req"]
status = "verified-offline"
text = "setup_req branches on bmRequestType & 0x60: standard requests use the bRequest jump table, and SET_CONFIGURATION/SET_INTERFACE reach the driver loop that calls [driver+0x18] = core_cb_start at 0x602b9b64 (return 0 leads to the delegated status queue at 0x9fd8). Class/vendor requests go to 0x602b9ffc and call [class_obj+0x2c] = core_cb_class; a class return of 0 only calls clear_halt_ep0 (one store of 0 to gc+0x83) and cannot stall, restart or re-arm EP0. No +0x34 callback is used."
evidence = ["E0375", "E0377", "E0378", "E0381"]

[[claim]]
id = "C23"
entities = ["problem.get-cur-5s", "dwc3.ep0"]
status = "inference"
text = "Synthesis: clear_halt_ep0 cannot re-arm EP0; the 5 s gap is the GET_CUR URB itself and the missing event is GET's status completion, after which SET_CUR is canceled."
evidence = ["E0381"]
note = "Consistent with the later S1 verdict (C02)."

[[claim]]
id = "C24"
entities = ["fn.giveback"]
status = "verified-offline"
text = "The reference req->complete is a single free_request (kfree); the 4.997 s gap is not inside it."
evidence = ["E0385"]

[[claim]]
id = "R10"
entities = ["fn.giveback"]
status = "retracted"
text = "Run B15: the 4.997 s gap starts inside the EP0 completion callback, before any status-stage processing."
evidence = ["E0383"]
superseded_by = "C24"

[[claim]]
id = "C25"
entities = ["dwc3.ep0"]
status = "verified-offline"
text = "Event-loop semantics: evt->count is a snapshot of GEVNTCOUNT for the whole batch and is not decremented; lpos is the currently executing event and advances by 4 after the handler returns. With that, the B12 batches are [0x294, 0x298, 0x29c] and [0x2a0, 0x2a4, 0x2a8] (not three ep0 XferCompletes before 'SET pre'). dwc3_ep0_start_trans has five call sites (0x25a4 status, 0x26c8 data, 0x2b68 out_start, 0x31d8 / 0x3314 inside complete_data); 0x3408 is an Update-Transfer DEPCMD, not a TRB arm."
evidence = ["E0381", "E0382", "E0384", "E0385"]

[[claim]]
id = "C26"
entities = ["problem.get-cur-5s"]
status = "verified-physical"
text = "GET_DESCRIPTOR completes data and status in 1.4-3.8 ms while GET_CUR's data completes in about 1 ms and the host then waits about 5.01 s; both carry the same request flag byte (req+0x1a = 02) in the early RAM ring. The gap before GET_CUR is the host's configuration window; UCX emits no SELECT_* records, so SET_CONFIGURATION/SET_INTERFACE are not directly visible, and no PTP interface-0 transfer appears."
evidence = ["E0394", "E0396", "E0397"]

