# ------------------------------------------------------------------ claims

[[claim]]
id = "C01"
entities = ["problem.get-cur-5s", "dwc3.ep0"]
status = "verified-physical"
text = "The camera's data stage of GET_CUR completes in about 1 ms (actual=26, status=0); the delay is not in the data stage."
evidence = ["E0365", "E0392", "E0471"]

[[claim]]
id = "C02"
entities = ["problem.get-cur-5s", "dwc3.ep0"]
status = "verified-physical"
text = "After the GET_CUR data stage, ep0state goes 2->3 (status TRB armed on eps0 OUT, STARTTRANSFER accepted) within 16.388 ms, then nothing changes for 5000.010 ms until the host aborts and sends the next SETUP (verdict S1)."
evidence = ["E0468", "E0471"]

[[claim]]
id = "C03"
entities = ["problem.get-cur-5s", "host.windows-xhci"]
status = "verified-physical"
text = "The 5.000 s is the Windows control-transfer timeout: Stop Endpoint + Set TR Dequeue at +5.000417 s, URB completes SUCCESS 26 B via the cancel path; SET_CUR then canceled 0xC0010000; retries fail with XACT_ERROR 0xC0000011."
evidence = ["E0382", "E0393", "E0458", "E0471"]

[[claim]]
id = "C04"
entities = ["problem.get-cur-5s", "dwc3.ep0"]
status = "inference"
text = "Root cause: missed Status OUT handshake. The host sends its single Status OUT right after DATA-IN, before the threaded IRQ arms the status TRB; DWC3 NAKs it (recorded NRDY(STATUS)); no later Status OUT completes the armed TRB."
evidence = ["E0471"]
note = "Strongly supported but not directly observed: ETW has no NAK/per-TRB trace and OBS samples every ~10 ms."

[[claim]]
id = "C05"
entities = ["dwc3.ep0", "fn.do-control-status"]
status = "verified-offline"
text = "With stock code the first status token is NAKed too: complete_data never arms a status TRB, only the NRDY(STATUS) and delayed_status paths call do_control_status. A faster req->complete cannot prevent the NAK."
evidence = ["E0386:retraction"]

[[claim]]
id = "C06"
entities = ["dwc3.ep0", "fn.do-control-status", "field.dwc-2d8"]
status = "verified-offline"
text = "The DWC3 status programming is correct: STATUS3 (0x40) for three-stage, direction from the dep argument, OUT len = maxpacket 64 on ctrl_req, ctrl 0xC43 (HWO|LST|IOC|ISP_IMI). Same path stock reads use successfully."
evidence = ["E0471", "E0382", "E0366"]

[[claim]]
id = "C07"
entities = ["problem.get-cur-5s", "usb.composite-0322"]
status = "inference"
text = "Descriptors and the composite layout are not implicated in the 5 s stall."
evidence = ["E0471", "E0389"]

[[claim]]
id = "C08"
entities = ["fn.giveback", "src.uvc-callback-bridge"]
status = "verified-offline"
text = "Gadget completion ABI is complete(ep, req), called with dwc->lock released."
evidence = ["E0364", "E0366"]

[[claim]]
id = "C09"
entities = ["fn.setup-req"]
status = "verified-offline"
text = "Class requests dispatch from the class/vendor branch 0x602b9ffc via [class_obj+0x2c], never through setup_req 0x9b64."
evidence = ["E0377"]

[[claim]]
id = "C10"
entities = ["fn.dwc3-ep0-interrupt"]
status = "verified-offline"
text = "Vendor status-complete path 0x602b334c is 5 instructions, never reads trb->size and has no SETUP_PENDING check (unlike mainline)."
evidence = ["E0386:retraction"]

[[claim]]
id = "C11"
entities = ["dwc3.ep0"]
status = "verified-offline"
text = "Replaying the observed event order through the real vmlinux dwc3_ep0_interrupt arms the status stage cleanly (2->3->1); the stall is not an EP0 software state-machine or queue bug. NRDY(status) before data-complete would NULL-deref, which was never seen live."
evidence = ["E0446:ep0"]

[[claim]]
id = "C14"
entities = ["fn.start-trans"]
status = "verified-offline"
text = "start_trans returns negative with no side effects only when DEPCMD times out (-110); dwc3_send_gadget_ep_cmd keeps only CMDACT and returns 0, so a hardware-rejected STARTTRANSFER (DEPCMD CmdStatus != 0) would still set dep BUSY, the resource index and next=1 with no warning."
evidence = ["E0386:retraction"]

[[claim]]
id = "C15"
entities = ["src.uvc-composite-shim", "fn.setup-req"]
status = "verified-physical"
text = "The E0465 restore guard fires in a shared-PTP session ('no legacy Mass Storage table saved ... legacy restore skipped'); no EP0 re-arm over a NULL table and no reboot (Run B25)."
evidence = ["E0465", "E0468"]

