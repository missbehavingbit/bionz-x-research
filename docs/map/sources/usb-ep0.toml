callback is two-argument and runs unlocked."""
related = ["fn.dwc3-ep0-interrupt"]

[[entity]]
id = "field.dwc-2d8"
kind = "field"
name = "struct dwc3 flags byte at dwc+0x2d8"
address = "dwc+0x2d8"
summary = """
bit0 three_stage_setup (selects STATUS3 0x40 vs STATUS2 0x30, not direction);
bit1 ep0_bounced; bit2 ep0_expect_in; bit3 start_config_issued;
bit4 setup_packet_pending; bit5 delayed_status; bit6 resize_fifos; bit7 pullups.
dwc+0x2dc is ep0_next_event and dwc+0x2e0 is ep0state."""
related = ["dwc3.ep0"]

