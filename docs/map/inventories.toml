# Firmware inventories: the denominators for knowledge-map coverage.
#
# A map entity joins an inventory through its `inventory` list, for example
#     inventory = ["kernel.text:__dwc3_ep0_do_control_status"]
# Coverage counts inventory members that at least one mapped entity names,
# graded by the strongest current claim about that entity. It measures how much
# of each inventory the map describes. It is not a firmware compatibility figure.
#
# kind = "kallsyms": counted from a captured /proc/kallsyms. `scope` is
#   "vmlinux" (text symbols without a [module] column) or "modules" (distinct
#   module names that own text symbols); `match` keeps only symbol names that
#   contain the given substring. The source is not tracked in Git, so `total`
#   is recorded here and re-verified (with the SHA-256) whenever the source is
#   present locally.
# kind = "json": a local JSON report, same re-verification. With `list`, the total is
#   the number of entries and members are matched by a suffix of `member_field`
#   (for example "nflasha15_unpacked/bin/im.elf"); otherwise `key` names an integer.
# kind = "status": the total of a bounded inventory in
#   tools/research/a6400_status_data.py (tracked, always verified).

[[inventory]]
id = "kernel.text"
title = "Kernel functions (distinct vmlinux text symbols)"
unit = "functions"
kind = "kallsyms"
scope = "vmlinux"
total = 14401
